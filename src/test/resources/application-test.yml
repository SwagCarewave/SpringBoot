spring:
  datasource:
    url: jdbc:h2:mem:carewave-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

jwt:
  secret: 12345678901234567890123456789012
  expiration: 3600000

cors:
  allowed-origins:
    - http://localhost:3000

cloud:
  aws:
    region:
      static: ap-northeast-2
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key
    s3:
      bucket: test-bucket
